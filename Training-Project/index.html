<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستشفى الشفاء التخصصي - نظام الحجوزات</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- هيدر الموقع -->
    <header>
        <h1>مستشفى الشفاء التخصصي</h1>
        <p>نعتني بصحتكم على مدار الساعة - احجز موعدك بسهولة</p>
    </header>

    <!-- قسم صور المستشفى والترحيب -->
    <section class="hero">
        <div class="hospital-info">
            <h2>أهلاً بكم في مستشفانا</h2>
            <p>نقدم أفضل الخدمات الطبية بأعلى معايير الجودة وبأيدي نخبة من الأطباء المتخصصين.</p>
        </div>
        <div class="image-container">
            <img src="https://images.unsplash.com/photo-1586773860418-d37222d8fce3?auto=format&fit=crop&w=600&q=80" alt="مستشفى الشفاء">
        </div>
    </section>

    <!-- أقسام المستشفى -->
    <section class="departments">
        <h2>أقسام المستشفى المتاحة</h2>
        <div id="dept-list" class="dept-grid">
            <!-- سيتم تعبئة الأقسام تلقائياً من الجافاسكريبت وتكون قابلة للضغط -->
        </div>
    </section>

    <!-- نموذج الحجز التفاعلي داخل الصفحة مع الـ id المطلوب -->
    <section class="booking-section" id="booking-form-section">
        <h2>حجز موعد جديد</h2>
        <div class="form-card">
            <label>اسم المريض:</label>
            <input type="text" id="patientName" placeholder="أدخل اسم المريض هنا">

            <label>سن المريض:</label>
            <input type="number" id="patientAge" min="0" placeholder="أدخل السن">

            <label>القسم المطلوب:</label>
            <select id="patientDept">
                <option value="باطنة">قسم الباطنة</option>
                <option value="أطفال">قسم الأطفال</option>
                <option value="عظام">قسم العظام</option>
                <option value="أسنان">قسم الأسنان</option>
            </select>

            <button onclick="submitBooking()">تأكيد وحجز الموعد</button>
        </div>

        <!-- صندوق عرض النتيجة والتنبيهات -->
        <div id="result-box" class="result-message" style="display: none;"></div>
    </section>

    <!-- ربط ملف الجافاسكريبت -->
    <script src="script.js"></script>
</body>
</html>
